    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Figtree:ital,wght@0,300..900;1,300..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"

    <title>Rayan Ghosh's Portfolio</title>
    <script>
      ;(function () {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
        var hash = location.hash
        if (hash.indexOf('#/') === 0) {
          var path = hash.slice(1)
          history.replaceState(null, '', path)
          if (path !== '/' && path !== '/about' && path !== '/experience') {
            scrollTo(0, 0)
          }
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
